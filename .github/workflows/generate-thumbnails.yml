name: Generate Thumbnails

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate all thumbnails even if JPGs look up to date'
        type: boolean
        default: false
  pull_request:
    branches: [ main, master ]
    paths:
      - 'categories/**'
      - 'pages/**'
      - 'scripts/generate-placeholder-social-images.js'
      - 'scripts/markdown-utils.js'
      - '_config.yml'
      - 'public/images/RetroReversingLogo.png'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generate-thumbnails.yml'

permissions:
  contents: write

concurrency:
  group: generate-thumbnails-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate-thumbnails:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ImageMagick and Arial
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y imagemagick ttf-mscorefonts-installer fontconfig
          sudo fc-cache -f
          fc-match Arial

      - name: Generate placeholder thumbnails
        run: |
          extra_args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            extra_args+=(--force)
          fi
          node scripts/generate-placeholder-social-images.js "${extra_args[@]}"

      - name: Commit generated thumbnails
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Generate placeholder social thumbnails
          file_pattern: public/generated/placeholders/*.jpg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
