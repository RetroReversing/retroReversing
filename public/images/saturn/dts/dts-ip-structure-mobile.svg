<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
  <title id="title">Initial Program structure at a glance</title>
  <desc id="desc">The Saturn Initial Program starts with a 256-byte system ID, followed by security code, area code, and the application initial program.</desc>
  <rect width="640" height="690" rx="18" fill="#ffffff"/>
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#173f51">Inside IP.BIN</text>
  <text x="32" y="92" font-family="Arial, sans-serif" font-size="21" fill="#47616d">The boot code leads into the application.</text>
  <g font-family="Arial, sans-serif">
    <rect x="32" y="122" width="576" height="125" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="163" font-size="27" font-weight="700" fill="#145f78">01  System ID · 0x100 bytes</text>
    <text x="54" y="198" font-size="22" fill="#173f51">Title, product, region, IP size and</text>
    <text x="54" y="226" font-size="22" fill="#173f51">first-read address</text>
    <rect x="32" y="263" width="576" height="105" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="306" font-size="27" font-weight="700" fill="#145f78">02  Security code · 0xD00 bytes</text>
    <text x="54" y="341" font-size="22" fill="#173f51">Checked by the boot process</text>
    <rect x="32" y="384" width="576" height="105" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="427" font-size="27" font-weight="700" fill="#145f78">03  Area code group</text>
    <text x="54" y="462" font-size="22" fill="#173f51">Determines compatible regions</text>
    <rect x="32" y="505" width="576" height="125" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="548" font-size="27" font-weight="700" fill="#145f78">04  Application initial program</text>
    <text x="54" y="583" font-size="22" fill="#173f51">Runs after area-code execution;</text>
    <text x="54" y="611" font-size="22" fill="#173f51">the application takes control</text>
    <text x="32" y="669" font-size="18" fill="#47616d">Reading guide reconstructed from Sega's disc specification.</text>
  </g>
</svg>
