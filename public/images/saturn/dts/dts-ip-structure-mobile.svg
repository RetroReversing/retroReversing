<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" aria-labelledby="title desc" role="img" viewBox="0 0 640 690"><title id="title">Initial Program structure at a glance</title><desc id="desc">The Saturn Initial Program starts with a 256-byte system ID, followed by security code, area code, and the application initial program.</desc><rect width="640" height="690" fill="#fff" rx="18"/><text x="32" y="58" fill="#173f51" font-family="Arial, sans-serif" font-size="31" font-weight="700">Inside IP.BIN</text><text x="32" y="92" fill="#47616d" font-family="Arial, sans-serif" font-size="21">The boot code leads into the application.</text><g font-family="Arial, sans-serif"><rect width="576" height="125" x="32" y="122" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="163" fill="#145f78" font-size="27" font-weight="700">01 System ID · 0x100 bytes</text><text x="54" y="198" fill="#173f51" font-size="22">Title, product, region, IP size and</text><text x="54" y="226" fill="#173f51" font-size="22">first-read address</text><rect width="576" height="105" x="32" y="263" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="306" fill="#145f78" font-size="27" font-weight="700">02 Security code · 0xD00 bytes</text><text x="54" y="341" fill="#173f51" font-size="22">Checked by the boot process</text><rect width="576" height="105" x="32" y="384" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="427" fill="#145f78" font-size="27" font-weight="700">03 Area code group</text><text x="54" y="462" fill="#173f51" font-size="22">Determines compatible regions</text><rect width="576" height="125" x="32" y="505" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="548" fill="#145f78" font-size="27" font-weight="700">04 Application initial program</text><text x="54" y="583" fill="#173f51" font-size="22">Runs after area-code execution;</text><text x="54" y="611" fill="#173f51" font-size="22">the application takes control</text><text x="32" y="669" fill="#47616d" font-size="18">Reading guide reconstructed from Sega&apos;s disc specification.</text></g></svg>