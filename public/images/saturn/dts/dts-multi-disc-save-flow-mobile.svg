<svg xmlns="http://www.w3.org/2000/svg" width="600" height="588" viewBox="0 0 600 588" role="img"><title>Disc 1 to Swap discs to Disc 2 to Resume</title><rect width="600" height="588" rx="12" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#145f78"/></marker></defs><rect x="30" y="20" width="540" height="104" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="300" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173f51">Disc 1</text><text x="300" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#344f5d">Save transition state</text><path d="M 300 128 V 160" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="168" width="540" height="104" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="300" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173f51">Swap discs</text><text x="300" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#344f5d">Boot ROM starts disc 2</text><path d="M 300 276 V 308" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="316" width="540" height="104" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="300" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173f51">Disc 2</text><text x="300" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#344f5d">Read backup RAM</text><path d="M 300 424 V 456" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="464" width="540" height="104" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="300" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#173f51">Resume</text><text x="300" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#344f5d">Use transition state</text></svg>