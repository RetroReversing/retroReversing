<svg xmlns="http://www.w3.org/2000/svg" width="640" height="565" viewBox="0 0 640 565" role="img" aria-labelledby="title desc">
  <title id="title">Saturn shuttle mouse report</title>
  <desc id="desc">Peripheral ID E3h is followed by three data bytes: buttons and sign or overflow flags, X movement, then Y movement.</desc>
  <rect width="640" height="565" rx="18" fill="#ffffff"/>
  <text x="32" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173f51">Shuttle mouse report</text>
  <text x="32" y="94" font-family="Arial, sans-serif" font-size="23" fill="#47616d">Peripheral ID E3h · 3 data bytes</text>
  <g font-family="Arial, sans-serif">
    <rect x="32" y="125" width="576" height="142" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="168" font-size="27" font-weight="700" fill="#145f78">Byte 1 · controls and flags</text>
    <text x="54" y="205" font-size="22" fill="#173f51">Y/X overflow · Y/X sign</text>
    <text x="54" y="237" font-size="22" fill="#173f51">Start · Middle · Right · Left</text>
    <rect x="32" y="284" width="576" height="94" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="326" font-size="27" font-weight="700" fill="#145f78">Byte 2 · X movement</text>
    <text x="54" y="355" font-size="21" fill="#173f51">Relative horizontal motion</text>
    <rect x="32" y="395" width="576" height="94" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="437" font-size="27" font-weight="700" fill="#145f78">Byte 3 · Y movement</text>
    <text x="54" y="466" font-size="21" fill="#173f51">Relative vertical motion</text>
    <text x="32" y="544" font-size="18" fill="#47616d">Reading guide to Sega Technical Bulletin 44's bit table.</text>
  </g>
</svg>
