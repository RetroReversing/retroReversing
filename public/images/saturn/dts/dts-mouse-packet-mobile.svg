<svg xmlns="http://www.w3.org/2000/svg" width="640" height="565" aria-labelledby="title desc" role="img" viewBox="0 0 640 565"><title id="title">Saturn shuttle mouse report</title><desc id="desc">Peripheral ID E3h is followed by three data bytes: buttons and sign or overflow flags, X movement, then Y movement.</desc><rect width="640" height="565" fill="#fff" rx="18"/><text x="32" y="57" fill="#173f51" font-family="Arial, sans-serif" font-size="30" font-weight="700">Shuttle mouse report</text><text x="32" y="94" fill="#47616d" font-family="Arial, sans-serif" font-size="23">Peripheral ID E3h · 3 data bytes</text><g font-family="Arial, sans-serif"><rect width="576" height="142" x="32" y="125" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="168" fill="#145f78" font-size="27" font-weight="700">Byte 1 · controls and flags</text><text x="54" y="205" fill="#173f51" font-size="22">Y/X overflow · Y/X sign</text><text x="54" y="237" fill="#173f51" font-size="22">Start · Middle · Right · Left</text><rect width="576" height="94" x="32" y="284" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="326" fill="#145f78" font-size="27" font-weight="700">Byte 2 · X movement</text><text x="54" y="355" fill="#173f51" font-size="21">Relative horizontal motion</text><rect width="576" height="94" x="32" y="395" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="437" fill="#145f78" font-size="27" font-weight="700">Byte 3 · Y movement</text><text x="54" y="466" fill="#173f51" font-size="21">Relative vertical motion</text><text x="32" y="544" fill="#47616d" font-size="18">Reading guide to Sega Technical Bulletin 44&apos;s bit table.</text></g></svg>