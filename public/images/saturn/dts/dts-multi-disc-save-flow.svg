<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" role="img" viewBox="0 0 1200 170"><title>Disc 1 to Swap discs to Disc 2 to Resume</title><rect width="1200" height="170" fill="#fff" rx="12"/><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#145f78" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="264" height="112" x="18" y="29" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="150" y="76" fill="#173f51" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Disc 1</text><text x="150" y="108" fill="#344f5d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Save transition state</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 287.0 85 H 311.0"/><rect width="264" height="112" x="318" y="29" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="450" y="76" fill="#173f51" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Swap discs</text><text x="450" y="108" fill="#344f5d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Boot ROM starts disc 2</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 587.0 85 H 611.0"/><rect width="264" height="112" x="618" y="29" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="750" y="76" fill="#173f51" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Disc 2</text><text x="750" y="108" fill="#344f5d" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Read backup RAM</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 887.0 85 H 911.0"/><rect width="264" height="112" x="918" y="29" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="1050" y="76" fill="#173f51" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Resume</text><text x="