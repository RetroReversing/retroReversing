<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">Two Saturn shadow paths</title><desc id="desc">Normal shadow writes a reserved palette value and darkens a background. MSB shadow sets a high bit and can darken the background or an existing sprite.</desc><rect width="1200" height="250" rx="14" fill="#ffffff"/><rect x="20" y="20" width="560" height="210" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><rect x="620" y="20" width="560" height="210" rx="12" fill="#f4f8fa" stroke="#8c3971" stroke-width="2"/><text x="45" y="59" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#173f51">Normal shadow</text><text x="645" y="59" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#562044">MSB shadow</text><rect x="45" y="82" width="215" height="72" rx="9" fill="#dceef4"/><text x="152" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#173f51">VDP1 writes a</text><text x="152" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173f51">reserved palette value</text><path d="M272 118 H322" stroke="#145f78" stroke-width="3"/><path d="M322 118 l-12 -8 v16 z" fill="#145f78"/><rect x="335" y="82" width="215" height="72" rx="9" fill="#dceef4"/><text x="442" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#173f51">VDP2 darkens</text><text x="442" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173f51">the background</text><rect x="645" y="82" width="215" height="72" rx="9" fill="#f5e7ef"/><text x="752" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#562044">VDP1 sets a</text><text x="752" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#562044">frame-buffer high bit</text><path d="M872 118 H922" stroke="#8c3971" stroke-width="3"/><path d="M922 118 l-12 -8 v16 z" fill="#8c3971"/><rect x="935" y="82" width="215" height="72" rx="9" fill="#f5e7ef"/><text x="1042" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#562044">VDP2 darkens</text><text x="1042" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#562044">sprite or background</text><text x="45" y="194" font-family="Arial,sans-serif" font-size="17" fill="#344f5d">RGB sprites remain available</text><text x="645" y="194" font-family="Arial,sans-serif" font-size="17" fill="#5c4353">RGB sprites cannot be mixed in</text></svg>
