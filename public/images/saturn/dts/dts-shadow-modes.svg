<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" aria-labelledby="title desc" role="img" viewBox="0 0 1200 250"><title id="title">Two Saturn shadow paths</title><desc id="desc">Normal shadow writes a reserved palette value and darkens a background. MSB shadow sets a high bit and can darken the background or an existing sprite.</desc><rect width="1200" height="250" fill="#fff" rx="14"/><rect width="560" height="210" x="20" y="20" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><rect width="560" height="210" x="620" y="20" fill="#f4f8fa" stroke="#8c3971" stroke-width="2" rx="12"/><text x="45" y="59" fill="#173f51" font-family="Arial,sans-serif" font-size="24" font-weight="700">Normal shadow</text><text x="645" y="59" fill="#562044" font-family="Arial,sans-serif" font-size="24" font-weight="700">MSB shadow</text><rect width="215" height="72" x="45" y="82" fill="#dceef4" rx="9"/><text x="152" y="111" fill="#173f51" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">VDP1 writes a</text><text x="152" y="135" fill="#173f51" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">reserved palette value</text><path stroke="#145f78" stroke-width="3" d="M272 118 H322"/><path fill="#145f78" d="M322 118 l-12 -8 v16 z"/><rect width="215" height="72" x="335" y="82" fill="#dceef4" rx="9"/><text x="442" y="111" fill="#173f51" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">VDP2 darkens</text><text x="442" y="135" fill="#173f51" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">the background</text><rect width="215" height="72" x="645" y="82" fill="#f5e7ef" rx="9"/><text x="752" y="111" fill="#562044" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">VDP1 sets a</text><text x="752" y="135" fill="#562044" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">frame-buffer high bit</text><path stroke="#8c3971" stroke-width="3" d="M872 118 H922"/><path fill="#8c3971" d="M922 118 l-12 -8 v16 z"/><rect width="215" height="72" x="935" y="82" fill="#f5e7ef" rx="9"/><text x="1042" y="111" fill="#562044" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">VDP2 darkens</text><text x="1042" y="135" fill="#562044" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">sprite or background</text><text x="45" y="194" fill="#344f5d" font-family="Arial,sans-serif" font-size="17">RGB sprites remain available</text><text x="645" y="194" fill="#5c4353" font-family="Arial,sans-serif" font-size="17">RGB sprites cannot be mixed in</text></svg>