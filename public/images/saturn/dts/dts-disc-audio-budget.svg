<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" aria-labelledby="title desc" role="img" viewBox="0 0 1200 210"><title id="title">Illustrative Saturn data and CD audio budget</title><desc id="desc">A maximal data track is approximately 566 megabytes. Adding five minutes of CD audio removes approximately 45 megabytes from that data capacity.</desc><rect width="1200" height="210" fill="#fff" rx="14"/><text x="28" y="38" fill="#173f51" font-family="Arial,sans-serif" font-size="20" font-weight="700">No extra CD audio</text><rect width="1144" height="46" x="28" y="54" fill="#dceef4" rx="9"/><rect width="1144" height="46" x="28" y="54" fill="#145f78" rx="9"/><text x="600" y="84" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle">about 566 MB for data</text><text x="28" y="140" fill="#173f51" font-family="Arial,sans-serif" font-size="20" font-weight="700">Add five minutes of CD audio</text><rect width="1144" height="46" x="28" y="156" fill="#f5e7ef" rx="9"/><path fill="#145f78" d="M37 156 H1072 V202 H37 Q28 202 28 193 V165 Q28 156 37 156 Z"/><text x="555" y="186" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">about 521 MB for data</text><text x="1120" y="185" fill="#562044" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">45 MB</text></svg>