<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">Illustrative Saturn data and CD audio budget</title><desc id="desc">A maximal data track is approximately 566 megabytes. Adding five minutes of CD audio removes approximately 45 megabytes from that data capacity.</desc><rect width="1200" height="210" rx="14" fill="#ffffff"/><text x="28" y="38" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f51">No extra CD audio</text><rect x="28" y="54" width="1144" height="46" rx="9" fill="#dceef4"/><rect x="28" y="54" width="1144" height="46" rx="9" fill="#145f78"/><text x="600" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">about 566 MB for data</text><text x="28" y="140" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#173f51">Add five minutes of CD audio</text><rect x="28" y="156" width="1144" height="46" rx="9" fill="#f5e7ef"/><path d="M37 156 H1072 V202 H37 Q28 202 28 193 V165 Q28 156 37 156 Z" fill="#145f78"/><text x="555" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">about 521 MB for data</text><text x="1120" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#562044">45 MB</text></svg>
