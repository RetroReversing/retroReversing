<svg xmlns="http://www.w3.org/2000/svg" width="640" height="666" viewBox="0 0 640 666" role="img" aria-labelledby="title desc">
  <title id="title">Saturn keyboard report</title>
  <desc id="desc">Peripheral ID 34h is followed by four data bytes: controller-style buttons, extended buttons and keyboard type, lock and make-break flags, then a key code.</desc>
  <rect width="640" height="666" rx="18" fill="#ffffff"/>
  <text x="32" y="57" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173f51">Keyboard report</text>
  <text x="32" y="94" font-family="Arial, sans-serif" font-size="23" fill="#47616d">Peripheral ID 34h · 4 data bytes</text>
  <g font-family="Arial, sans-serif">
    <rect x="32" y="125" width="576" height="97" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="167" font-size="27" font-weight="700" fill="#145f78">Byte 1 · pad-style buttons</text>
    <text x="54" y="199" font-size="21" fill="#173f51">Directions, Start and three triggers</text>
    <rect x="32" y="239" width="576" height="97" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="281" font-size="27" font-weight="700" fill="#145f78">Byte 2 · extended controls</text>
    <text x="54" y="313" font-size="21" fill="#173f51">Five triggers and keyboard type bits</text>
    <rect x="32" y="353" width="576" height="97" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="395" font-size="27" font-weight="700" fill="#145f78">Byte 3 · event flags</text>
    <text x="54" y="427" font-size="21" fill="#173f51">Lock state plus Make and Break</text>
    <rect x="32" y="467" width="576" height="116" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="54" y="509" font-size="27" font-weight="700" fill="#145f78">Byte 4 · key code</text>
    <text x="54" y="541" font-size="21" fill="#173f51">Meaningful when Make or Break</text>
    <text x="54" y="567" font-size="21" fill="#173f51">is set in byte 3</text>
    <text x="32" y="645" font-size="18" fill="#47616d">Reading guide to Sega Technical Bulletin 45's bit table.</text>
  </g>
</svg>
