<svg xmlns="http://www.w3.org/2000/svg" width="640" height="666" aria-labelledby="title desc" role="img" viewBox="0 0 640 666"><title id="title">Saturn keyboard report</title><desc id="desc">Peripheral ID 34h is followed by four data bytes: controller-style buttons, extended buttons and keyboard type, lock and make-break flags, then a key code.</desc><rect width="640" height="666" fill="#fff" rx="18"/><text x="32" y="57" fill="#173f51" font-family="Arial, sans-serif" font-size="30" font-weight="700">Keyboard report</text><text x="32" y="94" fill="#47616d" font-family="Arial, sans-serif" font-size="23">Peripheral ID 34h · 4 data bytes</text><g font-family="Arial, sans-serif"><rect width="576" height="97" x="32" y="125" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="167" fill="#145f78" font-size="27" font-weight="700">Byte 1 · pad-style buttons</text><text x="54" y="199" fill="#173f51" font-size="21">Directions, Start and three triggers</text><rect width="576" height="97" x="32" y="239" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="281" fill="#145f78" font-size="27" font-weight="700">Byte 2 · extended controls</text><text x="54" y="313" fill="#173f51" font-size="21">Five triggers and keyboard type bits</text><rect width="576" height="97" x="32" y="353" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="395" fill="#145f78" font-size="27" font-weight="700">Byte 3 · event flags</text><text x="54" y="427" fill="#173f51" font-size="21">Lock state plus Make and Break</text><rect width="576" height="116" x="32" y="467" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="54" y="509" fill="#145f78" font-size="27" font-weight="700">Byte 4 · key code</text><text x="54" y="541" fill="#173f51" font-size="21">Meaningful when Make or Break</text><text x="54" y="567" fill="#173f51" font-size="21">is set in byte 3</text><text x="32" y="645" fill="#47616d" font-size="18">Reading guide to Sega Technical Bulletin 45&apos;s bit table.</text></g></svg>