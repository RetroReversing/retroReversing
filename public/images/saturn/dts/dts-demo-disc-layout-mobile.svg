<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" aria-labelledby="title desc" role="img" viewBox="0 0 640 710"><title id="title">Demo-Demo disc directory layout</title><desc id="desc">The CD-ROM root holds the menu program, menu data, a per-game IP file, and the file loader kernel. Separate directories contain each game&apos;s program and data.</desc><rect width="640" height="710" fill="#fff" rx="16"/><g font-family="Arial, sans-serif"><text x="32" y="55" fill="#173f51" font-size="30" font-weight="700">Inside a multi-game disc</text><text x="32" y="88" fill="#47616d" font-size="20">Sega&apos;s documented Demo-Demo layout</text><rect width="576" height="256" x="32" y="114" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="55" y="155" fill="#145f78" font-size="27" font-weight="700">CD-ROM root</text><text x="55" y="197" fill="#173f51" font-size="23">Menu program + menu data</text><text x="55" y="236" fill="#173f51" font-size="23">Game1_IP.BIN + other game IP files</text><text x="55" y="275" fill="#173f51" font-size="23">FLD_KNL.BIN · file loader kernel</text><text x="55" y="336" fill="#47616d" font-size="19">The menu chooses which game to launch.</text><path stroke="#145f78" stroke-width="3" d="M320 370v38"/><path fill="none" stroke="#145f78" stroke-width="3" d="m312 398 8 10 8-10"/><rect width="576" height="96" x="32" y="412" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="55" y="451" fill="#145f78" font-size="25" font-weight="700">Game 1 directory</text><text x="55" y="484" fill="#173f51" font-size="21">Game 1 program + data</text><rect width="576" height="96" x="32" y="524" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="55" y="563" fill="#145f78" font-size="25" font-weight="700">Game 2 directory</text><text x="55" y="596" fill="#173f51" font-size="21">Game 2 program + data</text><text x="32" y="664" fill="#47616d" font-size="19">Tap to view the original Sega manual diagram.</text></g></svg>