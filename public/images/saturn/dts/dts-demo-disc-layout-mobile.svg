<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title desc">
  <title id="title">Demo-Demo disc directory layout</title>
  <desc id="desc">The CD-ROM root holds the menu program, menu data, a per-game IP file, and the file loader kernel. Separate directories contain each game's program and data.</desc>
  <rect width="640" height="710" rx="16" fill="#ffffff"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="55" font-size="30" font-weight="700" fill="#173f51">Inside a multi-game disc</text>
    <text x="32" y="88" font-size="20" fill="#47616d">Sega's documented Demo-Demo layout</text>
    <rect x="32" y="114" width="576" height="256" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="55" y="155" font-size="27" font-weight="700" fill="#145f78">CD-ROM root</text>
    <text x="55" y="197" font-size="23" fill="#173f51">Menu program + menu data</text>
    <text x="55" y="236" font-size="23" fill="#173f51">Game1_IP.BIN + other game IP files</text>
    <text x="55" y="275" font-size="23" fill="#173f51">FLD_KNL.BIN · file loader kernel</text>
    <text x="55" y="336" font-size="19" fill="#47616d">The menu chooses which game to launch.</text>
    <path d="M320 370v38" stroke="#145f78" stroke-width="3"/>
    <path d="m312 398 8 10 8-10" fill="none" stroke="#145f78" stroke-width="3"/>
    <rect x="32" y="412" width="576" height="96" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="55" y="451" font-size="25" font-weight="700" fill="#145f78">Game 1 directory</text>
    <text x="55" y="484" font-size="21" fill="#173f51">Game 1 program + data</text>
    <rect x="32" y="524" width="576" height="96" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="55" y="563" font-size="25" font-weight="700" fill="#145f78">Game 2 directory</text>
    <text x="55" y="596" font-size="21" fill="#173f51">Game 2 program + data</text>
    <text x="32" y="664" font-size="19" fill="#47616d">Tap to view the original Sega manual diagram.</text>
  </g>
</svg>
