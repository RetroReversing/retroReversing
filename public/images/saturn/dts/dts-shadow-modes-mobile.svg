<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" aria-labelledby="title desc" role="img" viewBox="0 0 640 520"><title id="title">Two Saturn shadow paths</title><desc id="desc">Normal shadows darken backgrounds. MSB shadows can darken sprites or backgrounds, but exclude RGB sprites.</desc><rect width="640" height="520" fill="#fff" rx="14"/><rect width="604" height="228" x="18" y="18" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="40" y="58" fill="#173f51" font-family="Arial,sans-serif" font-size="26" font-weight="700">Normal shadow</text><rect width="250" height="72" x="40" y="80" fill="#dceef4" rx="9"/><text x="165" y="110" fill="#173f51" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">VDP1 writes</text><text x="165" y="135" fill="#173f51" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">reserved colour</text><path stroke="#145f78" stroke-width="3" d="M299 116 H334"/><path fill="#145f78" d="M334 116 l-11 -8 v16 z"/><rect width="250" height="72" x="344" y="80" fill="#dceef4" rx="9"/><text x="469" y="110" fill="#173f51" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">VDP2 darkens</text><text x="469" y="135" fill="#173f51" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">background</text><text x="40" y="205" fill="#344f5d" font-family="Arial,sans-serif" font-size="19">RGB sprites remain available</text><rect width="604" height="236" x="18" y="266" fill="#f4f8fa" stroke="#8c3971" stroke-width="2" rx="12"/><text x="40" y="306" fill="#562044" font-family="Arial,sans-serif" font-size="26" font-weight="700">MSB shadow</text><rect width="250" height="72" x="40" y="329" fill="#f5e7ef" rx="9"/><text x="165" y="359" fill="#562044" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">VDP1 sets</text><text x="165" y="384" fill="#562044" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">frame-buffer high bit</text><path stroke="#8c3971" stroke-width="3" d="M299 365 H334"/><path fill="#8c3971" d="M334 365 l-11 -8 v16 z"/><rect width="250" height="72" x="344" y="329" fill="#f5e7ef" rx="9"/><text x="469" y="359" fill="#562044" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">VDP2 darkens</text><text x="469" y="384" fill="#562044" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">sprite or background</text><text x="40" y="458" fill="#5c4353" font-family="Arial,sans-serif" font-size="19">RGB sprites cannot be mixed in</text></svg>