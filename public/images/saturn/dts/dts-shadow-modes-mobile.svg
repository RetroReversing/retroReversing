<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc"><title id="title">Two Saturn shadow paths</title><desc id="desc">Normal shadows darken backgrounds. MSB shadows can darken sprites or backgrounds, but exclude RGB sprites.</desc><rect width="640" height="520" rx="14" fill="#ffffff"/><rect x="18" y="18" width="604" height="228" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="40" y="58" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#173f51">Normal shadow</text><rect x="40" y="80" width="250" height="72" rx="9" fill="#dceef4"/><text x="165" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f51">VDP1 writes</text><text x="165" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173f51">reserved colour</text><path d="M299 116 H334" stroke="#145f78" stroke-width="3"/><path d="M334 116 l-11 -8 v16 z" fill="#145f78"/><rect x="344" y="80" width="250" height="72" rx="9" fill="#dceef4"/><text x="469" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#173f51">VDP2 darkens</text><text x="469" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#173f51">background</text><text x="40" y="205" font-family="Arial,sans-serif" font-size="19" fill="#344f5d">RGB sprites remain available</text><rect x="18" y="266" width="604" height="236" rx="12" fill="#f4f8fa" stroke="#8c3971" stroke-width="2"/><text x="40" y="306" font-family="Arial,sans-serif" font-weight="700" font-size="26" fill="#562044">MSB shadow</text><rect x="40" y="329" width="250" height="72" rx="9" fill="#f5e7ef"/><text x="165" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#562044">VDP1 sets</text><text x="165" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#562044">frame-buffer high bit</text><path d="M299 365 H334" stroke="#8c3971" stroke-width="3"/><path d="M334 365 l-11 -8 v16 z" fill="#8c3971"/><rect x="344" y="329" width="250" height="72" rx="9" fill="#f5e7ef"/><text x="469" y="359" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#562044">VDP2 darkens</text><text x="469" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#562044">sprite or background</text><text x="40" y="458" font-family="Arial,sans-serif" font-size="19" fill="#5c4353">RGB sprites cannot be mixed in</text></svg>
