<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Paired Saturn static libraries in the SBL 6.01 archive</title>
  <desc id="desc">The archive places SEGA_GFS, SEGA_DMA, and SEGA_SGL in both GNU .A and Hitachi .LIB containers.</desc>
  <rect width="1200" height="330" rx="16" fill="#ffffff"/>
  <text x="36" y="58" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#173f51">One library family, two containers</text>
  <text x="36" y="92" font-family="Arial, sans-serif" font-size="21" fill="#47616d">Examples preserved together in the SBL 6.01 package</text>
  <g font-family="Arial, sans-serif">
    <rect x="36" y="118" width="525" height="151" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="60" y="153" font-size="25" font-weight="700" fill="#145f78">GNU archive · .A</text>
    <text x="60" y="188" font-size="22" fill="#173f51">SEGA_GFS.A</text>
    <text x="60" y="219" font-size="22" fill="#173f51">SEGA_DMA.A</text>
    <text x="60" y="250" font-size="22" fill="#173f51">SEGA_SGL.A</text>
    <rect x="639" y="118" width="525" height="151" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="663" y="153" font-size="25" font-weight="700" fill="#145f78">Hitachi library · .LIB</text>
    <text x="663" y="188" font-size="22" fill="#173f51">SEGA_GFS.LIB</text>
    <text x="663" y="219" font-size="22" fill="#173f51">SEGA_DMA.LIB</text>
    <text x="663" y="250" font-size="22" fill="#173f51">SEGA_SGL.LIB</text>
    <path d="M 577 194 H 623" stroke="#145f78" stroke-width="4"/>
    <path d="M 612 184 L 626 194 L 612 204" fill="none" stroke="#145f78" stroke-width="4"/>
    <text x="36" y="309" font-size="19" fill="#47616d">Matching names do not make the archive formats interchangeable.</text>
  </g>
</svg>
