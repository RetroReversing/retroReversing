<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" aria-labelledby="title desc" role="img" viewBox="0 0 1200 330"><title id="title">Paired Saturn static libraries in the SBL 6.01 archive</title><desc id="desc">The archive places SEGA_GFS, SEGA_DMA, and SEGA_SGL in both GNU .A and Hitachi .LIB containers.</desc><rect width="1200" height="330" fill="#fff" rx="16"/><text x="36" y="58" fill="#173f51" font-family="Arial, sans-serif" font-size="31" font-weight="700">One library family, two containers</text><text x="36" y="92" fill="#47616d" font-family="Arial, sans-serif" font-size="21">Examples preserved together in the SBL 6.01 package</text><g font-family="Arial, sans-serif"><rect width="525" height="151" x="36" y="118" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="60" y="153" fill="#145f78" font-size="25" font-weight="700">GNU archive · .A</text><text x="60" y="188" fill="#173f51" font-size="22">SEGA_GFS.A</text><text x="60" y="219" fill="#173f51" font-size="22">SEGA_DMA.A</text><text x="60" y="250" fill="#173f51" font-size="22">SEGA_SGL.A</text><rect width="525" height="151" x="639" y="118" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="663" y="153" fill="#145f78" font-size="25" font-weight="700">Hitachi library · .LIB</text><text x="663" y="188" fill="#173f51" font-size="22">SEGA_GFS.LIB</text><text x="663" y="219" fill="#173f51" font-size="22">SEGA_DMA.LIB</text><text x="663" y="250" fill="#173f51" font-size="22">SEGA_SGL.LIB</text><path stroke="#145f78" stroke-width="4" d="M 577 194 H 623"/><path fill="none" stroke="#145f78" stroke-width="4" d="M 612 184 L 626 194 L 612 204"/><text x="36" y="309" fill="#47616d" font-size="19">Matching names do not make the archive formats interchangeable.</text></g></svg>