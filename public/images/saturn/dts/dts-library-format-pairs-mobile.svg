<svg xmlns="http://www.w3.org/2000/svg" width="640" height="638" aria-labelledby="title desc" role="img" viewBox="0 0 640 638"><title id="title">Paired Saturn static libraries in the SBL 6.01 archive</title><desc id="desc">The archive places SEGA_GFS, SEGA_DMA, and SEGA_SGL in both GNU .A and Hitachi .LIB containers.</desc><rect width="640" height="638" fill="#fff" rx="16"/><text x="32" y="56" fill="#173f51" font-family="Arial, sans-serif" font-size="30" font-weight="700">Two library containers</text><text x="32" y="91" fill="#47616d" font-family="Arial, sans-serif" font-size="21">Paired names in the SBL 6.01 package</text><g font-family="Arial, sans-serif"><rect width="576" height="192" x="32" y="118" fill="#edf5f8" stroke="#145f78" stroke-width="2" rx="12"/><text x="55" y="158" fill="#145f78" font-size="27" font-weight="700">GNU archive · .A</text><text x="55" y="200" fill="#173f51" font-size="23">SEGA_GFS.A</text><text x="55" y="238" fill="#173f51" font-size="23">SEGA_DMA.A</text><text x="55" y="276" fill="#173f51" font-size="23">SEGA_SGL.A</text><rect width="576" height="192" x="32" y="328" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="12"/><text x="55" y="368" fill="#145f78" font-size="27" font-weight="700">Hitachi library · .LIB</text><text x="55" y="410" fill="#173f51" font-size="23">SEGA_GFS.LIB</text><text x="55" y="448" fill="#173f51" font-size="23">SEGA_DMA.LIB</text><text x="55" y="486" fill="#173f51" font-size="23">SEGA_SGL.LIB</text><text x="32" y="570" fill="#47616d" font-size="20">Matching names do not make the archive</text><text x="32" y="599" fill="#47616d" font-size="20">formats interchangeable.</text></g></svg>