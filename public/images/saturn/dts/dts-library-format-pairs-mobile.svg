<svg xmlns="http://www.w3.org/2000/svg" width="640" height="638" viewBox="0 0 640 638" role="img" aria-labelledby="title desc">
  <title id="title">Paired Saturn static libraries in the SBL 6.01 archive</title>
  <desc id="desc">The archive places SEGA_GFS, SEGA_DMA, and SEGA_SGL in both GNU .A and Hitachi .LIB containers.</desc>
  <rect width="640" height="638" rx="16" fill="#ffffff"/>
  <text x="32" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#173f51">Two library containers</text>
  <text x="32" y="91" font-family="Arial, sans-serif" font-size="21" fill="#47616d">Paired names in the SBL 6.01 package</text>
  <g font-family="Arial, sans-serif">
    <rect x="32" y="118" width="576" height="192" rx="12" fill="#edf5f8" stroke="#145f78" stroke-width="2"/>
    <text x="55" y="158" font-size="27" font-weight="700" fill="#145f78">GNU archive · .A</text>
    <text x="55" y="200" font-size="23" fill="#173f51">SEGA_GFS.A</text>
    <text x="55" y="238" font-size="23" fill="#173f51">SEGA_DMA.A</text>
    <text x="55" y="276" font-size="23" fill="#173f51">SEGA_SGL.A</text>
    <rect x="32" y="328" width="576" height="192" rx="12" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/>
    <text x="55" y="368" font-size="27" font-weight="700" fill="#145f78">Hitachi library · .LIB</text>
    <text x="55" y="410" font-size="23" fill="#173f51">SEGA_GFS.LIB</text>
    <text x="55" y="448" font-size="23" fill="#173f51">SEGA_DMA.LIB</text>
    <text x="55" y="486" font-size="23" fill="#173f51">SEGA_SGL.LIB</text>
    <text x="32" y="570" font-size="20" fill="#47616d">Matching names do not make the archive</text>
    <text x="32" y="599" font-size="20" fill="#47616d">formats interchangeable.</text>
  </g>
</svg>
