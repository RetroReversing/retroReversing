<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">Illustrative Saturn data and CD audio budget</title><desc id="desc">A maximal data track is approximately 566 megabytes. Adding five minutes of CD audio removes approximately 45 megabytes from that data capacity.</desc><rect width="640" height="300" rx="14" fill="#ffffff"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173f51">No extra CD audio</text><rect x="28" y="65" width="584" height="56" rx="9" fill="#145f78"/><text x="320" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#ffffff">about 566 MB data</text><text x="28" y="172" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#173f51">Add five minutes of CD audio</text><rect x="28" y="189" width="584" height="56" rx="9" fill="#f5e7ef"/><path d="M37 189 H566 V245 H37 Q28 245 28 236 V198 Q28 189 37 189 Z" fill="#145f78"/><text x="296" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">about 521 MB data</text><text x="528" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#562044">45 MB audio</text></svg>
