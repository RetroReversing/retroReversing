<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" aria-labelledby="title desc" role="img" viewBox="0 0 640 300"><title id="title">Illustrative Saturn data and CD audio budget</title><desc id="desc">A maximal data track is approximately 566 megabytes. Adding five minutes of CD audio removes approximately 45 megabytes from that data capacity.</desc><rect width="640" height="300" fill="#fff" rx="14"/><text x="28" y="48" fill="#173f51" font-family="Arial,sans-serif" font-size="24" font-weight="700">No extra CD audio</text><rect width="584" height="56" x="28" y="65" fill="#145f78" rx="9"/><text x="320" y="101" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">about 566 MB data</text><text x="28" y="172" fill="#173f51" font-family="Arial,sans-serif" font-size="24" font-weight="700">Add five minutes of CD audio</text><rect width="584" height="56" x="28" y="189" fill="#f5e7ef" rx="9"/><path fill="#145f78" d="M37 189 H566 V245 H37 Q28 245 28 236 V198 Q28 189 37 189 Z"/><text x="296" y="225" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">about 521 MB data</text><text x="528" y="278" fill="#562044" font-family="Arial,sans-serif" font-size="19" text-anchor="middle">45 MB audio</text></svg>