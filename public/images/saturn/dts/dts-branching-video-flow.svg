<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img"><title>Player choice to BPL to Select to Decode</title><rect width="1200" height="170" rx="12" fill="#ffffff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#145f78"/></marker></defs><rect x="18.0" y="29" width="264.0" height="112" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="150.0" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173f51">Player choice</text><text x="150.0" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#344f5d">Next-scene options</text><path d="M 287.0 85 H 311.0" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="318.0" y="29" width="264.0" height="112" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="450.0" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173f51">BPL</text><text x="450.0" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#344f5d">Pre-read streams</text><path d="M 587.0 85 H 611.0" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="618.0" y="29" width="264.0" height="112" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="750.0" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173f51">Select</text><text x="750.0" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#344f5d">Choose destination</text><path d="M 887.0 85 H 911.0" stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="918.0" y="29" width="264.0" height="112" rx="10" fill="#f4f8fa" stroke="#145f78" stroke-width="2"/><text x="1050.0" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#173