<svg xmlns="http://www.w3.org/2000/svg" width="600" height="588" role="img" viewBox="0 0 600 588"><title>Player choice to BPL to Select to Decode</title><rect width="600" height="588" fill="#fff" rx="12"/><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#145f78" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="540" height="104" x="30" y="20" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="300" y="63" fill="#173f51" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Player choice</text><text x="300" y="96" fill="#344f5d" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Next-scene options</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 300 128 V 160"/><rect width="540" height="104" x="30" y="168" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="300" y="211" fill="#173f51" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">BPL</text><text x="300" y="244" fill="#344f5d" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Pre-read streams</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 300 276 V 308"/><rect width="540" height="104" x="30" y="316" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="300" y="359" fill="#173f51" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Select</text><text x="300" y="392" fill="#344f5d" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Choose destination</text><path stroke="#145f78" stroke-width="2.5" marker-end="url(#arrow)" d="M 300 424 V 456"/><rect width="540" height="104" x="30" y="464" fill="#f4f8fa" stroke="#145f78" stroke-width="2" rx="10"/><text x="300" y="507" fill="#173f51" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Decode</text><text x="300" y="540" fill