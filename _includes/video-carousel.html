{% if include.videocarousel %}
<section class="bg-inverse p-y-0">
    <div class="owl-carousel owl-slide owl-slide-no-auto">
      {% for item in include.videocarousel %}
        <div class="carousel-item" style="height: 70vh; background-image: url('{{ item.image }}');">
          <div class="carousel-overlay"></div>
          <div class="carousel-caption">
              <div class="embed-responsive embed-responsive-16by9">
                {% if item.youtube %}
                <iframe class="embed-responsive-item" src="https://www.youtube.com/embed/{{ item.youtube }}" title="{{ item.title | escape }} on YouTube" loading="lazy" allowfullscreen></iframe>
                {% endif %}
                {% if item.twitch %}
                <iframe data-twitch-video="{{ item.twitch }}" title="{{ item.title | escape }} on Twitch" loading="lazy" frameborder="0" allowfullscreen scrolling="no"></iframe>
                {% endif %}
              </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </section>
  <script>
    document.querySelectorAll("iframe[data-twitch-video]").forEach(function (frame) {
      var url = new URL("https://player.twitch.tv/");
      url.searchParams.set("video", "v" + frame.dataset.twitchVideo);
      url.searchParams.set("parent", window.location.hostname);
      url.searchParams.set("autoplay", "false");
      frame.src = url.toString();
    });
  </script>
{% endif %}
