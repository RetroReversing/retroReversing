egg_laying:
  variant: stages
  eyebrow: Mini-game states / egglaying.h
  title: Feed, swallow, lay
  controls_label: Egg-laying machines
  caption: State names come from the enums in egglaying.h. Timing depends on the live station, so this is a state list rather than a scored playthrough.
  options:
    - key: chicken
      label: Chicken
      steps: [Feed me, Eating, Swallow, Lay, Relief]
      note: EGGLAYER_FEEDME through EGGLAYER_RELIEF. Idle and breath sit beside that working loop.
    - key: grain
      label: Grain
      steps: [Stopped, Stopping, Active, Starting]
      note: EL_GRAIN_STOPPED through EL_GRAIN_STARTING control whether grain is moving at a station.
    - key: session
      label: Session
      steps: [Fade in, Intro, Running, Finish]
      note: The session enum also has separate succeed, fail, and medal states after EL_RUNNING.

bff:
  variant: pipeline
  eyebrow: Level container / bff_load.c
  title: Load, mark, then link
  controls_label: BFF load paths
  caption: The selected labels identify source-code responsibilities. A zero CRC means the only object of that type. Version-0 PSI asserts instead of linking.
  options:
    - key: load
      label: Load file
      nodes:
        - {step: '01 / open', heading: Load the whole container, code: BFF_LoadFile / fileLoad}
        - {step: '02 / mark', heading: Flag the last segment by length, code: 'work->len |= 0x80000000'}
        - {step: '03 / link', heading: Switch on type and rebuild pointers, code: BFF_Link_PSI1 / BFF_Link_FMA_Mesh}
    - key: find
      label: Find object
      nodes:
        - {step: '01 / type', heading: Four-character type with a version byte, code: work->id}
        - {step: '02 / name', heading: CRC of the object name, or zero for the only one, code: BFF_FindObject}
        - {step: '03 / use', heading: Return the matching segment, code: BFF_FindNamedObject}
    - key: psi
      label: PSI model
      nodes:
        - {step: '01 / type', heading: PSI1 is the live model type, code: BFF_PSI1_ID}
        - {step: '02 / link', heading: Rebuild the model pointers, code: BFF_Link_PSI1}
        - {step: '03 / reject', heading: Version 0 still asserts, code: BFF_PSI_ID}
    - key: fma
      label: Frog map
      nodes:
        - {step: '01 / mesh', heading: Link mesh format 5 or 6, code: BFF_Link_FMA_Mesh}
        - {step: '02 / world', heading: Link the frog-map world, code: BFF_Link_FMA_World}
        - {step: '03 / lookup', heading: Later code finds meshes by CRC, code: BFF_FMA_MESH_ID}

save:
  variant: pipeline
  eyebrow: Memory card / card.c + islcard.c
  title: Sony layout inside a VMU file
  controls_label: Save-pack routes
  caption: The write path still builds a PlayStation header, then Dreamcast wraps that payload. Replay uses a second gameplay pointer that is never written back.
  options:
    - key: header
      label: Sony header
      nodes:
        - {step: '01 / magic', heading: Write the SC bytes, code: header.magic}
        - {step: '02 / icon', heading: Copy one icon into all three slots, code: SHELL/SAVEICON.SPT}
        - {step: '03 / title', heading: Convert Chicken Run to Shift-JIS, code: asciiStringToSJIS}
    - key: layers
      label: Three layers
      nodes:
        - {step: '01 / options', heading: Permanent control settings, code: OPTIONDATASTR options}
        - {step: '02 / state', heading: Unlocks, medals, and best results, code: GameSaveDataType state}
        - {step: '03 / play', heading: Inventories, tasks, and map flags, code: GamePlayDataType play}
    - key: vmu
      label: VMU wrap
      nodes:
        - {step: '01 / lcd', heading: Show the saving graphic, code: 'cardDisplay(LCD_saving)'}
        - {step: '02 / wrap', heading: Build the Sega backup image, code: buMakeBackupFileImage}
        - {step: '03 / result', heading: Show OK or error on the LCD, code: 'cardDisplay(LCD_ok)'}
