audio:
  variant: bars
  eyebrow: The sound shelf / PR/tengine/sounds
  title: 5,034 files
  controls_label: Audio chart view
  caption: Counts and approximate durations come from the audio headers in this copy. No sound files are served by this page.
  options:
    - key: format
      label: By format
      bars:
        - {label: AIFF source, value: 4406}
        - {label: N64 VADPCM, value: 628}
    - key: duration
      label: By duration
      bars:
        - {label: Under 0.5 s, value: 168}
        - {label: 0.5-1 s, value: 991}
        - {label: 1-2 s, value: 2942}
        - {label: 2-5 s, value: 884}
        - {label: 5 s or longer, value: 49}

boss:
  variant: mode-table
  eyebrow: Boss mode board / trex.c
  title: Inside the T. Rex mode table
  controls_label: Tyrannosaurus modes
  caption: Each selection is one row from TRexModeTable in trex.c. These examples are not a sequence of phases in a single fight.
  field_labels:
    animation: Animation
    setup: Setup callback
    update: Update callback
    speed: Animation speed
    flags: Flags
  options:
    - key: entrance
      label: Entrance
      group: Elevator mode
      heading: Protected arrival
      copy: The idle pose on the elevator stays invincible while the boss enters the arena.
      animation: AI_ANIM_BOSS_TREX_IDLE
      update: TRex_Code_OnElevator
      speed: '1'
      flags: BF_INVINCIBLE | BF_ENTER_MODE
    - key: hunt
      label: Run
      group: Movement mode
      heading: Pursuit with head tracking
      copy: This run row combines movement code, faster playback, head tracking, and the laser flag.
      animation: AI_ANIM_BOSS_TREX_RUN
      update: TRex_Code_Movement
      speed: '1.5'
      flags: BF_RUNNING_MODE | BF_HEAD_TRACK_TUROK | BF_LASER_ON
    - key: fire
      label: Breath fire
      group: Looping attack
      heading: Flame breath loop
      copy: The setup callback prepares the breath attack; the update callback keeps its firing loop running.
      animation: AI_ANIM_BOSS_TREX_BREATH_FIRE
      setup: TRex_Setup_BREATH_FIRE
      update: TRex_Code_FireLoop
      speed: '1'
      flags: BF_FLAME_MODE
    - key: cave
      label: Cave look
      group: Cave special
      heading: Looking from the cave
      copy: The cave attack routine runs this look animation. This row sets no special mode flags.
      animation: AI_ANIM_BOSS_TREX_CAVE_LOOK
      update: TRex_Code_CaveAttack
      speed: '1'
      flags: '0'

map:
  variant: reveal
  eyebrow: Cartography / map.c
  title: Discovery crosses connected regions
  map_label: Illustrative connected-room map with a closed gate
  reveal_label: Open gate
  reset_label: Reset map
  initial_note: The closed door keeps the next connected region hidden.
  revealed_note: With the open-door flag set, the reveal can pass into neighboring regions.
  caption: This simplified map illustrates REGFLAG_DOOR, REGFLAG_OPENDOOR, and recursive region reveal; it is not a game level.
  cells:
    - {label: '01 / START', initially_visible: true}
    - {label: '02 / PASSAGE', initially_visible: true}
    - {label: 'GATE / CLOSED', revealed_label: 'GATE / OPEN', gate: true}
    - {label: '04 / CHAMBER'}
    - {label: '05 / EXIT'}

attract:
  variant: timeline
  eyebrow: Demo tape / attract.c
  title: Input changes over time
  controls_label: Illustrative demo beats
  caption: A fabricated four-beat sequence explains the packed format; it is not a surviving demo recording.
  options:
    - key: ready
      label: Ready
      badge: '00'
      heading: Starting point
      copy: The header selects a warp and records how many frames the demo spans.
      code: warp ID + total frames
    - key: move
      label: Move
      badge: '01'
      heading: Stick changes
      copy: The X and Y axes have their own bit streams. A change is followed by a frame duration.
      code: stick X / stick Y + time
    - key: jump
      label: Jump
      badge: '02'
      heading: Jump held
      copy: Button bits reproduce a controller state; the duration says how long it persists.
      code: R button + frame count
    - key: fire
      label: Fire
      badge: '03'
      heading: Fire held
      copy: Playback reads the next packed button state, then advances by its stored duration.
      code: Z trigger + frame count

mechanisms:
  variant: stages
  eyebrow: Moving architecture / aidoor.c
  title: Each machine has a clock
  controls_label: Level mechanisms
  caption: State sequences distilled from the advance routines; timing depends on object settings.
  options:
    - key: platform
      label: Platform
      steps: [Triggered, Waits for delay, Moves away, Resets]
      note: A collapsing platform changes its region, waits, moves to its destination, then returns after another timer.
    - key: pressure
      label: Pressure action
      steps: [Starts, Waits for message, Plays action, Restarts]
      note: The pressure-action routine tests its interactive message timer before it enters the active animation.
    - key: portal
      label: Portal
      steps: [Triggered, Makes warp, Raises effect, Stops]
      note: The portal routine makes its region a warp and ramps an effect value upward while active.

weapons:
  variant: pipeline
  eyebrow: Effects pipeline / aiweap.c + particle.c + fx.c
  title: Three modules, one shot
  controls_label: Weapon examples
  caption: The selected labels identify source-code responsibilities, not a frame-accurate simulation.
  options:
    - key: arrow
      label: Explosive arrow
      nodes:
        - {step: '01 / weapon', heading: Tek Bow update, code: aiweap.c}
        - {step: '02 / projectile', heading: Explosive arrow, code: particle.c}
        - {step: '03 / visual', heading: Two arrow swooshes, code: fx.c}
    - key: chrono
      label: Chronoscepter
      nodes:
        - {step: '01 / weapon', heading: Chronoscepter update, code: aiweap.c}
        - {step: '02 / projectile', heading: Chronoscepter particle, code: particle.c}
        - {step: '03 / visual', heading: Two chrono swooshes, code: fx.c}
    - key: rocket
      label: Rocket
      nodes:
        - {step: '01 / weapon', heading: Rocket update, code: aiweap.c}
        - {step: '02 / projectile', heading: Rocket particle, code: particle.c}
        - {step: '03 / visual', heading: Rocket swoosh, code: fx.c}

training:
  variant: card
  eyebrow: Training card / train.c
  title: The same lesson in three builds
  controls_label: Training text language
  caption: Text and bytes are short excerpts from train.c. The Japanese branch needs the game's font mapping to display as characters.
  options:
    - key: english
      label: English
      branch: '#ifdef ENGLISH'
      heading: jumping
      copy: "press the r\nbutton to jump."
    - key: german
      label: German
      branch: '#ifdef GERMAN'
      heading: springen
      copy: "zum springen\nknopf r dr/cken."
    - key: kanji
      label: KANJI bytes
      branch: '#ifdef KANJI'
      heading: 2C 3D 27 35 27 29
      copy: "2C 3D 27 36 64\nE9 13 22 28 41 33 0F 27"

perception:
  variant: pipeline
  eyebrow: Enemy senses / ai.c
  title: Three routes to an alert enemy
  controls_label: Enemy detection routes
  caption: Follow the checks from left to right. Each enemy has its own sight and hearing settings; the cards do not represent distances to scale.
  options:
    - key: sight
      label: In sight
      signal: sight
      signal_label: Vision check
      signal_detail: Range, angle, and a clear ray must all pass.
      nodes:
        - step: '1 / Distance'
          heading: Target within sight radius?
          code: m_SightRadius
        - step: '2 / Direction'
          heading: Target inside view angle?
          code: m_SightAngle
        - step: '3 / Obstruction'
          heading: Clear ray raises sight event and agitation
          code: CAnimInstanceHdr__CastYeThyRay
    - key: quiet
      label: Quiet noise
      signal: sound
      signal_label: Quiet sound event
      signal_detail: Hearing tests its configured quiet radius; no clear view is needed.
      nodes:
        - step: '1 / Event'
          heading: Quiet noise reaches the AI
          code: AI_MEvent_QuietNoise
        - step: '2 / Distance'
          heading: Sound within quiet-hearing radius?
          code: m_QuietRadius
        - step: '3 / Reaction'
          heading: Quiet-noise flag and agitation
          code: AI_EV_QUIETNOISE
    - key: loud
      label: Loud noise
      signal: sound
      signal_label: Loud sound event
      signal_detail: Hearing tests a separate loud radius; no clear view is needed.
      nodes:
        - step: '1 / Event'
          heading: Loud noise reaches the AI
          code: AI_MEvent_LoudNoise
        - step: '2 / Distance'
          heading: Sound within loud-hearing radius?
          code: m_LoudRadius
        - step: '3 / Reaction'
          heading: Loud-noise flag and agitation
          code: AI_EV_LOUDNOISE

oxygen:
  variant: meter
  eyebrow: Underwater clock / tmove.c
  title: The warning arrives late
  input_label: Seconds spent underwater without a tank
  meter_label: Air remaining
  unit: s
  max_value: 70
  warning_start: 55
  early_label: Before the warning
  warning_label: Air bar appears
  danger_label: Out of air
  early_copy: Turok is using his breath, but the air bar has not appeared yet.
  warning_copy: In the final 15 seconds, the on-screen bar fades in and drains.
  danger_copy: Once the timer runs out, drowning reduces health until Turok reaches air.
  caption: Drag through the 70-second source timer. This simplifies the display fade and frame timing; an oxygen tank pauses the breath countdown while its own supply lasts.

collectibles:
  variant: collection
  eyebrow: Relic hunt / pickup.c
  title: Eight pieces make a weapon
  controls_label: Chronoscepter pieces
  collect_label: Collect piece
  reset_label: Scatter pieces
  initial_note: Each piece sets one bit in the collection mask.
  complete_note: All eight bits are set (0xff). The game grants the completed Chronoscepter and ammunition.
  caption: Click the eight pieces to assemble the source-code bitmask. This is a schematic collection board, not a map of pickup locations.
  slots:
    - {label: '01', bit: 1}
    - {label: '02', bit: 2}
    - {label: '03', bit: 4}
    - {label: '04', bit: 8}
    - {label: '05', bit: 16}
    - {label: '06', bit: 32}
    - {label: '07', bit: 64}
    - {label: '08', bit: 128}

camera:
  variant: timeline
  eyebrow: Opening cinema / introcam.c
  title: A camera move with a script
  controls_label: Opening camera beats
  caption: The stages follow introcam.c; the labels summarize source behavior rather than exact on-screen frame boundaries.
  options:
    - key: acclaim
      label: Logos
      badge: '01'
      heading: Establish the opening
      copy: Separate camera modes handle Acclaim's logo and the Iguana intro before the character shot.
      code: INTRO_ACCLAIM_LOGO_WARP_ID / INTRO_IGGY_WARP_ID
    - key: bow
      label: Bow shot
      badge: '02'
      heading: Circle toward Turok
      copy: A camera track changes rotation, radius, eye height, and focus height across a 12.8-second bow-drawing shot.
      code: CCameraView__TweenTrackAroundTurok
    - key: focus
      label: Field of view
      badge: '03'
      heading: Change the frame during the move
      copy: The bow shot also advances its field of view and eye position as its stage timer runs.
      code: CCamera__SetFieldOfView
    - key: logo
      label: Title
      badge: '04'
      heading: Move to the Turok logo
      copy: The next intro mode zooms toward the title, and the transition can be accelerated after the first run.
      code: CAMERA_INTRO_ZOOM_TO_LOGO_MODE

sun:
  variant: occlusion
  eyebrow: Light through the canopy / sun.c
  title: Eight depth samples decide the glare
  controls_label: Sun obstruction examples
  result_label: Weighted visibility
  samples_count: 8
  focus_index: 3
  focus_weight: 3
  caption: The eight-sample display is schematic. The source weights the sun's own depth sample three times and each neighboring sample once, producing a value from zero to one.
  options:
    - key: clear
      label: Clear sky
      heading: All eight samples see sky
      copy: Seven neighboring samples plus the three-weight sun sample yield full visibility.
      samples: '11111111'
    - key: edge
      label: Near an edge
      heading: Four samples are blocked
      copy: The sun sample and three neighbors remain clear, so the weighted result is six tenths.
      samples: '01011010'
    - key: hidden
      label: Behind stone
      heading: Every sample is blocked
      copy: With no clear depth samples, the visibility value falls to zero.
      samples: '00000000'
